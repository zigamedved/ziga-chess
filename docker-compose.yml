# One process: JVM on 8081 runs the feature CLI, then Lucene.
# Prerequisites:
#   1. cp .env.example .env   # set AUTH_USERNAME / AUTH_PASSWORD
#   2. git lfs pull && make index-sample   # or make index
#   3. docker compose up --build
#
# Then:
#   curl -u "$AUTH_USERNAME:$AUTH_PASSWORD" -H 'Content-Type: application/json' \
#     -d '{"FEN":"r4rk1/4Rppp/p1p5/P1p5/8/3P2P1/1PP2P1P/R5K1 b - - 0 25"}' \
#     http://127.0.0.1:8081/analyse
#
# Optional APP_PREFIX (e.g. /v1/chess) is applied to /analyse and /position.
# Healthchecks stay on unprefixed /ping. Leave APP_PREFIX empty for local defaults.

services:
  chess:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PREFIX: ${APP_PREFIX:-}
    ports:
      - "8081:8081"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      LUCENE_INDEX_DIR: /app/indexedFiles
      LUCENE_TOP_K: ${LUCENE_TOP_K:-20}
      APP_PREFIX: ${APP_PREFIX:-}
      PORT: "8081"
      CHESSAPP_DIR: /app/python-server
      STOCKFISH_PATH: /app/python-server/engine/stockfish
    volumes:
      - ./java-server/indexedFiles:/app/indexedFiles:ro
    healthcheck:
      # Unprefixed /ping is always registered (even when APP_PREFIX is set).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s
