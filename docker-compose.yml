# One-command local stack (no Mongo).
# Prerequisites:
#   1. cp .env.example .env   # set AUTH_USERNAME / AUTH_PASSWORD
#   2. git lfs pull && make index-sample   # or make index
#   3. docker compose up --build
#
# Then:
#   curl -u "$AUTH_USERNAME:$AUTH_PASSWORD" -H 'Content-Type: application/json' \
#     -d '{"FEN":"r4rk1/4Rppp/p1p5/P1p5/8/3P2P1/1PP2P1P/R5K1 b - - 0 25"}' \
#     http://127.0.0.1:8081/analyse
#
# Optional APP_PREFIX (e.g. /v1/chess): must match for both services. Healthchecks
# still use unprefixed /ping (both servers register it). The Python→Java hop uses
# JAVA_SERVICE_URL with the same prefix. Leave APP_PREFIX empty for local defaults.

services:
  java-server:
    build:
      context: ./java-server
      args:
        PREFIX: ${APP_PREFIX:-}
    ports:
      - "8080:8080"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      LUCENE_INDEX_DIR: /app/indexedFiles
      LUCENE_TOP_K: ${LUCENE_TOP_K:-50}
      APP_PREFIX: ${APP_PREFIX:-}
    volumes:
      - ./java-server/indexedFiles:/app/indexedFiles:ro
    healthcheck:
      # Unprefixed /ping is always registered (even when APP_PREFIX is set).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  python-server:
    build:
      context: ./python-server
      args:
        PREFIX: ${APP_PREFIX:-}
    ports:
      - "8081:8081"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      # Include APP_PREFIX so /position resolves when a URL prefix is configured.
      JAVA_SERVICE_URL: http://java-server:8080${APP_PREFIX:-}/position
      STOCKFISH_PATH: /app/engine/stockfish
      APP_PREFIX: ${APP_PREFIX:-}
    depends_on:
      java-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
