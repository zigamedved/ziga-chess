openapi: 3.0.3
info:
  title: ziga-chess analyse
  version: "1.6.0"
  description: >
    Public API of the single JVM on port 8081. POST /analyse returns this
    document by default. Accept text/plain returns the previous thesis body.
    APP_PREFIX, when set, is prepended to /analyse, /position, and /quiz.
    GET /ping stays unprefixed.
servers:
  - url: http://127.0.0.1:8081
paths:
  /analyse:
    post:
      operationId: analyse
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyseRequest"
      responses:
        "200":
          description: Similar games and the two principal variations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyseResponse"
            text/plain:
              schema:
                type: string
                description: Legacy body. Send Accept text/plain.
        "400":
          description: Missing or invalid FEN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or wrong Basic credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Feature CLI or Lucene failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quiz:
    get:
      operationId: listQuiz
      security:
        - basicAuth: []
      responses:
        "200":
          description: Positions in the Dvoretsky quiz set. Solutions are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizPosition"
        "401":
          description: Missing or wrong Basic credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: answerQuiz
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswer"
      responses:
        "200":
          description: >
            Whether the move matches the stored solution. The solution is
            included only when the move is correct or showSolution is true.
            Similar games are POST /analyse on the returned fen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "400":
          description: Missing id, or neither a move nor showSolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or wrong Basic credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown quiz id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ping:
    get:
      operationId: ping
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            text/plain:
              schema:
                type: string
                example: pong
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    QuizPosition:
      type: object
      required: [id, title, fen]
      properties:
        id:
          type: string
        title:
          type: string
        fen:
          type: string
    QuizAnswer:
      type: object
      required: [id]
      properties:
        id:
          type: string
        san:
          type: string
          description: >
            The guessed move in SAN. A leading move number such as 1. or 1...
            is ignored. Compared with the first move of that position's PV1.
        showSolution:
          type: boolean
          description: Return the solution without requiring a correct move.
    QuizResult:
      type: object
      required: [id, title, fen, correct, revealed]
      properties:
        id:
          type: string
        title:
          type: string
        fen:
          type: string
        correct:
          type: boolean
        revealed:
          type: boolean
        solution:
          type: string
          description: Present only when revealed is true.
    AnalyseRequest:
      type: object
      description: Send FEN, or PGN when FEN is omitted.
      properties:
        FEN:
          type: string
          description: Position to analyse. Used when present, including when PGN is also set.
        PGN:
          type: string
          description: >
            Full game. Used when FEN is omitted. The server walks the main line
            and analyses the first rook endgame: a legal position whose pieces
            are only kings, rooks, and pawns, with at least one rook.
        result:
          type: string
          enum: ["1-0", "0-1", "1/2-1/2"]
          description: >
            Keep similar games with this result. Omit it to leave ranking unchanged.
            The index must store Result as an indexed field (`make index` after this schema).
        minElo:
          type: integer
          minimum: 0
          description: >
            Keep games whose Elo is at least this value. Elo is the average of
            WhiteElo and BlackElo when both parse, otherwise the one rating present.
            Games with no rating are left out.
        maxElo:
          type: integer
          minimum: 0
          description: Keep games whose Elo is at most this value. Same average as minElo.
        family:
          type: string
          enum: [rook, bishop]
          description: >
            Keep similar games tagged with this endgame family. Omit it to leave
            ranking unchanged. The tag is written by `make index`. An older index
            has no `endgameFamily` field, so this filter matches nothing until then.
    AnalyseResponse:
      type: object
      required: [fen, principalVariations, similarGames, similarPgn, meta]
      properties:
        fen:
          type: string
          description: Analysed position. For a PGN request this is the detected rook endgame.
        endgamePly:
          type: integer
          description: >
            Half-move index of fen on the PGN main line. 0 is the start position.
            Present only when the request was a PGN.
        endgameFamily:
          type: string
          enum: [rook, bishop, other]
          description: >
            Material of the analysed position. Rook is kings, rooks, and pawns
            with at least one rook. Bishop is kings, bishops, and pawns with at
            least one bishop. Anything else is other.
        warning:
          type: string
          description: Present when endgameFamily is other. The search still runs.
        principalVariations:
          type: array
          items:
            $ref: "#/components/schemas/PrincipalVariation"
        similarGames:
          type: array
          items:
            $ref: "#/components/schemas/SimilarGame"
        similarPgn:
          type: string
          description: >
            Multi-game PGN of similarGames, in rank order. A stored movetext
            gains Event, White, Black, Result, and FEN headers. A game whose
            PGN already starts with "[" is copied through. Games are separated
            by a blank line.
        meta:
          $ref: "#/components/schemas/AnalyseMeta"
    PrincipalVariation:
      type: object
      required: [id, pgn]
      properties:
        id:
          type: integer
        pgn:
          type: string
    SimilarGame:
      type: object
      required: [rank, name, white, black, result, endgameFen, pgn, pv1, pv2, score, explanation]
      properties:
        rank:
          type: integer
        name:
          type: string
        white:
          type: string
        black:
          type: string
        result:
          type: string
        whiteElo:
          type: string
          description: White's rating from the corpus, when the game stored one.
        blackElo:
          type: string
          description: Black's rating from the corpus, when the game stored one.
        endgameFen:
          type: string
        endgameFamily:
          type: string
          enum: [rook, bishop, other]
          description: Family stored on the indexed game. Absent on an index built before this field.
        pgn:
          type: string
        pv1:
          type: string
        pv2:
          type: string
        score:
          type: number
        explanation:
          $ref: "#/components/schemas/MatchExplanation"
    MatchExplanation:
      type: object
      required: [fields, tokens]
      description: >
        Why this game matched. Field scores sum the BM25 weight of matched
        tokens in static, other, and dynamic. tokens lists at most five,
        highest score first.
      properties:
        fields:
          type: array
          items:
            type: object
            required: [field, score]
            properties:
              field:
                type: string
                enum: [static, other, dynamic]
              score:
                type: number
        tokens:
          type: array
          items:
            type: object
            required: [field, token, score]
            properties:
              field:
                type: string
              token:
                type: string
              score:
                type: number
    AnalyseMeta:
      type: object
      required: [engineDepth, limitDepth, tookMs]
      properties:
        engineDepth:
          type: integer
          description: Stockfish search depth reported by the feature CLI.
        limitDepth:
          type: integer
          description: Variation-tree depth reported by the feature CLI.
        tookMs:
          type: integer
          description: Milliseconds spent in the feature CLI and the Lucene search.
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [bad_request, invalid_fen, invalid_pgn, no_endgame, not_found, unauthorized, error]
